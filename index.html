:root{--bg:#06080c;--surf:rgba(255,255,255,.045);--bd:rgba(255,255,255,.09);--tx:#e9eef5;--mut:#7d8896;--c1:#22d3ee;--c2:#3b82f6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
:root[data-theme="light"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg)}
body{color:var(--tx);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:-20% -10% auto -10%;height:60%;background:radial-gradient(60% 60% at 50% 0%,rgba(34,211,238,.16),transparent 70%),radial-gradient(40% 50% at 85% 10%,rgba(59,130,246,.14),transparent 70%);pointer-events:none;z-index:0}
header,#msgs,#f,#chips{position:relative;z-index:1}
header{display:flex;align-items:center;gap:12px;padding:14px 18px}
.orb{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a5f3fc,var(--c1) 35%,var(--c2) 75%);box-shadow:0 0 18px rgba(34,211,238,.6),0 0 40px rgba(59,130,246,.35);animation:pulse 3.2s ease-in-out infinite;flex:none}
@keyframes pulse{50%{box-shadow:0 0 26px rgba(34,211,238,.9),0 0 60px rgba(59,130,246,.5);transform:scale(1.05)}}
.t{flex:1;min-width:0}
h1{font:700 18px "Space Grotesk",Inter,system-ui,sans-serif;letter-spacing:.18em;margin:0}
.st{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.st i{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
button{font:inherit;cursor:pointer;color:inherit}
.ib{background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:9px 13px;font-size:14px;display:flex;gap:6px;align-items:center}
.ib:hover{border-color:rgba(34,211,238,.5)}
#msgs{flex:1;overflow-y:auto;padding:8px 18px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.m{max-width:86%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.u{align-self:flex-end;background:linear-gradient(135deg,var(--c1),var(--c2));color:#03121c;font-weight:500;border-bottom-right-radius:5px}
.a{align-self:flex-start;background:var(--surf);border:1px solid var(--bd);border-bottom-left-radius:5px;backdrop-filter:blur(8px)}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots b{width:7px;height:7px;border-radius:50%;background:var(--c1);animation:b 1.1s infinite ease-in-out}
.dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.note{align-self:center;color:var(--mut);font-size:13px;text-align:center;max-width:90%}
#chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 10px}
#chips button{background:var(--surf);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font-size:14px;color:#cfe9f2}
#chips button:hover{border-color:rgba(34,211,238,.5)}
#f{display:flex;align-items:flex-end;gap:8px;margin:6px 14px 14px;padding:8px 8px 8px 16px;background:rgba(18,22,30,.9);border:1px solid var(--bd);border-radius:22px;backdrop-filter:blur(10px)}
#f:focus-within{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--tx);font:inherit;max-height:120px;padding:7px 0}
textarea::placeholder{color:var(--mut)}
#send{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;color:#03121c}
#send:disabled{opacity:.4}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#shade.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:760px;max-height:70%;background:#0d1117;border:1px solid var(--bd);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;z-index:6;display:flex;flex-direction:column}
#sheet.on{transform:none}
#sheet h2{font:700 15px "Space Grotesk",Inter,sans-serif;letter-spacing:.12em;margin:0 0 4px}
#sheet p{margin:0 0 10px;color:var(--mut);font-size:13px}
#list{overflow-y:auto}
.f{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.f button{background:none;border:0;color:#f87171;font-size:13px}
.clr{margin-top:12px;background:none;border:1px solid var(--bd);border-radius:12px;padding:9px;color:var(--mut);font-size:14px}
.orb{position:relative}
.orb::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid transparent;border-top-color:var(--c1);border-right-color:rgba(59,130,246,.6);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.think .orb{animation-duration:.9s}
body.think .orb::after{animation-duration:.7s}
body::before{animation:glow 9s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.55;transform:translateY(4%) scale(1.06)}}
body::after{content:"";position:fixed;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.12),transparent 70%);left:-90px;bottom:8%;pointer-events:none;z-index:0;animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(70vw,-35vh) scale(1.35)}}
.u{transform-origin:100% 100%;animation:inr .4s cubic-bezier(.2,.9,.3,1.25)}
.a{transform-origin:0 100%;animation:inl .4s cubic-bezier(.2,.9,.3,1.25)}
@keyframes inr{from{opacity:0;transform:translateX(28px) scale(.9)}}
@keyframes inl{from{opacity:0;transform:translateX(-28px) scale(.9)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
#chips button{animation:up .55s both;transition:transform .2s,border-color .2s,box-shadow .2s}
#chips button:nth-child(2){animation-delay:.12s}
#chips button:nth-child(3){animation-delay:.24s}
#chips button:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(34,211,238,.15)}
#send{transition:transform .15s,box-shadow .2s}
#send:hover:not(:disabled){box-shadow:0 0 18px rgba(34,211,238,.65);transform:scale(1.06)}
#send:active:not(:disabled){transform:scale(.88)}
body.think #send{animation:glow2 1s ease-in-out infinite}
@keyframes glow2{50%{box-shadow:0 0 20px rgba(34,211,238,.85)}}
.st i{animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
body.think .st i{background:var(--c1);box-shadow:0 0 8px var(--c1)}
.f{animation:up .4s both}
.pop{display:inline-block;animation:pop .5s}
@keyframes pop{40%{transform:scale(1.7);color:var(--c1)}}
.ib{transition:transform .15s,border-color .2s}
.ib:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
#boot{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .6s,visibility .6s}
#boot.off{opacity:0;visibility:hidden}
#boot .core{position:relative;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a5f3fc,var(--c1) 35%,var(--c2) 75%);box-shadow:0 0 40px rgba(34,211,238,.7),0 0 90px rgba(59,130,246,.45);animation:bootin 1s cubic-bezier(.2,.9,.3,1.2) both,pulse 2.4s 1s ease-in-out infinite}
#boot .core::before,#boot .core::after{content:"";position:absolute;border-radius:50%;border:2px solid transparent}
#boot .core::before{inset:-14px;border-top-color:var(--c1);border-bottom-color:rgba(59,130,246,.5);animation:spin 1.6s linear infinite}
#boot .core::after{inset:-30px;border-left-color:rgba(34,211,238,.45);border-right-color:rgba(59,130,246,.3);animation:spin 2.6s linear infinite reverse}
@keyframes bootin{from{opacity:0;transform:scale(.3)}}
#boot h2{font:700 22px "Space Grotesk",Inter,sans-serif;letter-spacing:.5em;margin:0 0 0 .5em;animation:up .8s .3s both}
#boot .bar{width:160px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;animation:up .8s .5s both}
#boot .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:3px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#boot p{margin:0;font-size:12px;color:var(--mut);letter-spacing:.2em;animation:up .8s .6s both}
.wave{display:inline-flex;align-items:center;gap:4px;height:22px}
.wave b{width:4px;height:100%;border-radius:3px;background:linear-gradient(var(--c1),var(--c2));animation:eq 1s ease-in-out infinite}
.wave b:nth-child(2){animation-delay:.12s}.wave b:nth-child(3){animation-delay:.24s}.wave b:nth-child(4){animation-delay:.36s}.wave b:nth-child(5){animation-delay:.48s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.typing::after{content:"";display:inline-block;width:8px;height:1em;margin-left:3px;vertical-align:-2px;background:var(--c1);border-radius:2px;animation:cur .8s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.a.wait{animation:inl .4s cubic-bezier(.2,.9,.3,1.25),aura 1.6s ease-in-out infinite}
@keyframes aura{0%,100%{box-shadow:0 0 0 1px rgba(34,211,238,.2),0 0 14px rgba(34,211,238,.08)}50%{box-shadow:0 0 0 1px rgba(34,211,238,.55),0 0 30px rgba(34,211,238,.3)}}
</style></head>
<body>
<div id="boot"><div class="core"></div><h2>JARVIS</h2><div class="bar"><i></i></div><p>INITIALIZING</p></div>
<header>
  <div class="orb"></div>
  <div class="t"><h1>JARVIS</h1><div class="st"><i></i><span id="stx">Online</span></div></div>
  <button class="ib" id="keyBtn" aria-label="Settings">⚙</button>
  <button class="ib" id="memBtn" aria-label="Open memory">🧠 <span id="cnt">0</span></button>
</header>
<div id="msgs"></div>
<div id="chips"></div>
<form id="f"><textarea id="t" rows="1" placeholder="Message Jarvis…"></textarea><button id="send" type="submit" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form>
<div id="shade"></div>
<div id="sheet"><h2>MEMORY</h2><p>What Jarvis knows about you. Only you can see this.</p><div id="list"></div></div>
<script>
const $=s=>document.querySelector(s);
let sample=null,ref=null,mem={facts:[],hist:[]},busy=false;
const T=(p,ms)=>Promise.race([p,new Promise(z=>setTimeout(()=>z(null),ms))]);
const KEY="jarvis_key",MODEL="claude-sonnet-5-5",FAST="claude-haiku-5-5";
const ready=Promise.resolve();
const getKey=()=>{try{return localStorage.getItem(KEY)||""}catch(e){return ""}};
function setKey(){const k=prompt("Paste your free Google Gemini API key (from aistudio.google.com/apikey). It stays on this device only.",getKey());if(k!==null){try{localStorage.setItem(KEY,k.trim())}catch(e){}$("#stx").textContent=getKey()?"Online":"Add API key"}}
async function pickModel(){let m="";try{m=localStorage.getItem("jarvis_model")||""}catch(e){}if(m)return m;
  try{const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",{headers:{"x-goog-api-key":getKey()}});const d=await r.json();
    const c=(d.models||[]).filter(x=>/^models\/gemini-[\d.]+-flash$/.test(x.name)&&(x.supportedGenerationMethods||[]).includes("generateContent")).map(x=>x.name.slice(7)).sort((a,b)=>parseFloat(b.split("-")[1])-parseFloat(a.split("-")[1]));
    if(c[0]){m=c[0];try{localStorage.setItem("jarvis_model",m)}catch(e){}return m}}catch(e){}
  return "gemini-flash-latest"}
async function ask(messages,model,max,system,json){const k=getKey();if(!k)throw{code:"bad_key"};
  const body={contents:messages.map(x=>({role:x.role==="assistant"?"model":"user",parts:[{text:x.content}]}))};
  if(system)body.system_instruction={parts:[{text:system}]};
  if(json)body.generationConfig={responseMimeType:"application/json"};
  const mdl=await pickModel();
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+mdl+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":k},body:JSON.stringify(body)});
  if(!r.ok){let m="";try{m=(await r.json()).error.message}catch(e){}if(r.status===404){try{localStorage.removeItem("jarvis_model")}catch(e){}}
    throw{code:r.status===429?"rate_limited":((r.status===400&&/key/i.test(m))||r.status===401||r.status===403)?"bad_key":"api",message:m}}
  const d=await r.json();const c=((d.candidates||[])[0]||{}).content;return((c&&c.parts)||[]).map(x=>x.text||"").join("")||"…"}
async function askJSON(p){const t=await ask([{role:"user",content:p}],FAST,300,null,true);return JSON.parse(t.replace(/```json|```/g,"").trim())}
async function reveal(el,s){const st=Math.max(1,Math.ceil(s.length/180));for(let i=0;i<s.length;i+=st){el.textContent=s.slice(0,i+st);$("#msgs").scrollTop=1e9;await new Promise(z=>setTimeout(z,16))}el.textContent=s}
const LS="jarvis_mem_v1";
const SYS="You are Jarvis, a sharp, warm, concise personal assistant for one person. Use what you know about them naturally, never list it back unprompted. Keep replies short unless asked for more. You cannot yet make calls or control apps, so say so honestly if asked, and offer to draft, plan or organize in chat instead.";
const CHIPS=["What can you do?","Remember my name and what I’m working on","Help me plan my day"];
function add(cls,txt){const d=document.createElement("div");d.className="m "+cls;d.textContent=txt;$("#msgs").appendChild(d);$("#msgs").scrollTop=1e9;return d}
function note(txt){const d=document.createElement("div");d.className="note";d.textContent=txt;$("#msgs").appendChild(d)}
function chips(){const c=$("#chips");c.textContent="";if(mem.hist.length)return;CHIPS.forEach(x=>{const b=document.createElement("button");b.type="button";b.textContent=x;b.onclick=()=>{$("#t").value=x;$("#f").requestSubmit()};c.appendChild(b)})}
function sheet(on){$("#sheet").classList.toggle("on",on);$("#shade").classList.toggle("on",on)}
function renderMem(){
  const c0=$("#cnt");if(c0.textContent!=mem.facts.length){c0.textContent=mem.facts.length;c0.classList.remove("pop");void c0.offsetWidth;c0.classList.add("pop")}
  const box=$("#list");box.textContent="";
  if(!mem.facts.length){const p=document.createElement("div");p.className="note";p.textContent="Nothing yet. Tell Jarvis about yourself.";box.appendChild(p);return}
  mem.facts.forEach((x,i)=>{const r=document.createElement("div");r.className="f";r.style.animationDelay=Math.min(i,8)*50+"ms";const s=document.createElement("span");s.textContent=x;const b=document.createElement("button");b.textContent="Forget";b.onclick=()=>{mem.facts.splice(i,1);save();renderMem()};r.append(s,b);box.appendChild(r)});
  const c=document.createElement("button");c.className="clr";c.textContent="Clear everything";c.onclick=()=>{mem={facts:[],hist:[]};save();renderMem();$("#msgs").textContent="";intro();chips();sheet(false)};box.appendChild(c);
}
async function save(){
  try{localStorage.setItem(LS,JSON.stringify(mem))}catch(e){}
  if(ref){try{await ref.set(mem)}catch(e){}}
}
function intro(){const d=add("a","");const s="Hi, I’m Jarvis. Tell me about yourself, your projects and what you like, and I’ll remember it next time.";if(matchMedia("(prefers-reduced-motion:reduce)").matches){d.textContent=s;return}let i=0;const k=setInterval(()=>{d.textContent=s.slice(0,++i);if(i>=s.length)clearInterval(k)},22)}
async function load(){
  try{const s=localStorage.getItem(LS);if(s)mem=JSON.parse(s)}catch(e){}
  await ready;
  if(mem.hist.length)mem.hist.slice(-8).forEach(m=>add(m.role==="user"?"u":"a",m.content));else intro();
  renderMem();chips();
  if(!getKey()){$("#stx").textContent="Add API key";note("Tap ⚙ and paste your free Gemini API key to start.")}
}
async function learn(userTxt,reply){
  try{
    const r=await askJSON("Known facts: "+JSON.stringify(mem.facts)+"\nNew exchange:\nUser: "+userTxt+"\nAssistant: "+reply+"\n\nList NEW durable facts the user stated about themselves, their projects or preferences (short strings, not already known). Return only a JSON array of strings, [] if none.");
    if(Array.isArray(r)){r.filter(x=>typeof x==="string"&&x.trim()&&!mem.facts.includes(x.trim())).forEach(x=>mem.facts.push(x.trim()));mem.facts=mem.facts.slice(-60)}
  }catch(e){}
}
$("#f").addEventListener("submit",async e=>{
  e.preventDefault();const t=$("#t").value.trim();if(!t||busy)return;if(!getKey()){setKey();if(!getKey())return}
  busy=true;document.body.classList.add("think");$("#send").disabled=true;$("#t").value="";$("#chips").textContent="";$("#stx").textContent="Thinking…";add("u",t);
  mem.hist.push({role:"user",content:t});
  const bub=add("a","");bub.classList.add("wait");bub.innerHTML='<span class="wave"><b></b><b></b><b></b><b></b><b></b></span>';
  let hh=mem.hist.slice(-14);while(hh.length&&hh[0].role!=="user")hh.shift();const system=SYS+"\n\nWhat you know about the user:\n"+(mem.facts.length?mem.facts.map(x=>"- "+x).join("\n"):"(nothing yet)");const input=hh;
  try{
    bub.classList.remove("wait");bub.classList.add("typing");const r=await ask(input,MODEL,1000,system);await reveal(bub,r);
    bub.classList.remove("wait","typing");const reply=r;bub.textContent=reply;
    mem.hist.push({role:"assistant",content:reply});mem.hist=mem.hist.slice(-30);
    await Promise.race([learn(t,reply),new Promise(z=>setTimeout(z,15000))]);await save();renderMem();
  }catch(err){
    mem.hist.pop();bub.classList.remove("wait","typing");const c=err&&err.code;bub.textContent=c==="bad_key"?"That Gemini API key was rejected. Tap ⚙ to enter it again.":c==="rate_limited"?"Slow down a moment, then try again.":(err&&err.name==="AbortError")||c==="aborted"?"That took too long. Try again.":"Something went wrong"+(err&&err.message?" ("+err.message+")":"")+". Try again.";
  }
  busy=false;document.body.classList.remove("think");$("#send").disabled=false;$("#stx").textContent="Online";$("#t").focus();
});
$("#t").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px"});
$("#t").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(min-width:700px)").matches){e.preventDefault();$("#f").requestSubmit()}});
$("#keyBtn").onclick=setKey;$("#memBtn").onclick=()=>sheet(true);$("#shade").onclick=()=>sheet(false);
const t0=Date.now();Promise.race([load(),new Promise(z=>setTimeout(z,6000))]).then(()=>setTimeout(()=>$("#boot").classList.add("off"),Math.max(0,1900-(Date.now()-t0))));
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
